[project]
name = "card-fraud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "razvanp06", email = "pica.razvan30@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
